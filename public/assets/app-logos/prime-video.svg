    <!-- prime in Amazon Cyan -->
    <text x="0" y="24" fill="#00A8E1" font-family="'Amazon Ember', Arial, Helvetica, sans-serif" font-weight="900" font-size="26" letter-spacing="-0.5">prime</text>
    <!-- video in Pure White -->
    <text x="73" y="24" fill="#FFFFFF" font-family="'Amazon Ember', Arial, Helvetica, sans-serif" font-weight="800" font-size="26" letter-spacing="-0.5">video</text>
