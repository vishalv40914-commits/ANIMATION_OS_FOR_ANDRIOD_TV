<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 42" fill="none">
  <!-- Google Play Games Official Controller Emblem -->
  <g transform="translate(6, 4)">
    <!-- Green Gamepad Body -->
    <path d="M29.5 5.5C27 5.5 25 7 24 9.2L22 13h-8l-2-3.8C11 7 9 5.5 6.5 5.5 2.9 5.5 0 8.4 0 12c0 6.6 4.4 17 9.5 21 2.2 1.8 5.2 2 7.7.7l4.8-2.7h4l4.8 2.7c2.5 1.3 5.5 1.1 7.7-.7 5.1-4 9.5-14.4 9.5-21 0-3.6-2.9-6.5-6.5-6.5z" fill="#00C853"/>
    <!-- D-Pad (Left) -->
    <path d="M10 13v6M7 16h6" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <!-- 4 Colored Action Buttons (Right) -->
    <circle cx="28" cy="13.5" r="1.6" fill="#EA4335"/><!-- Red (Top) -->
    <circle cx="31.5" cy="16.5" r="1.6" fill="#4285F4"/><!-- Blue (Right) -->
    <circle cx="28" cy="19.5" r="1.6" fill="#34A853"/><!-- Green (Bottom) -->
    <circle cx="24.5" cy="16.5" r="1.6" fill="#FBBC05"/><!-- Yellow (Left) -->
  </g>
  <!-- Wordmark in White -->
  <g fill="#FFFFFF" transform="translate(56, 12)">
    <text x="0" y="16" fill="#FFFFFF" font-family="'Google Sans', Roboto, Arial, sans-serif" font-weight="700" font-size="18" letter-spacing="-0.2">Play Games</text>
  </g>
</svg>

